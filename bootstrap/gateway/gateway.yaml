apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: kube-system
  annotations:
    io.cilium/lb-ipam-ips: "192.168.1.192"
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      allowedRoutes:
        namespaces:
          from: All
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: public-tls-secret 
            namespace: kube-system
    - name: http
      allowedRoutes:
        namespaces:
          from: All
      port: 80
      protocol: HTTP
