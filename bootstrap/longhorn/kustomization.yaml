apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ensure all resources are created in this namespace
namespace: longhorn-system

resources:
  - namespace.yaml

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.10.1  # It is good practice to pin a specific version
    releaseName: longhorn
    namespace: longhorn-system
    valuesFile: values.yaml