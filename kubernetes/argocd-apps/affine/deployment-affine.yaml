apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  namespace: affine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: affine
  template:
    metadata:
      labels:
        app: affine
    spec:
      # ---------------------------------------------------------
      # NEW: InitContainer to run the migration (predeploy)
      # This mimics the 'affine_migration' service from docker-compose
      # ---------------------------------------------------------
      initContainers:
      - name: migration
        image: ghcr.io/toeverything/affine:stable
        command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
        env:
        - name: NODE_ENV
          value: "production"
        - name: AFFINE_SERVER_HOST
          value: "0.0.0.0"
        - name: AFFINE_SERVER_PORT
          value: "3010"
        - name: AFFINE_SERVER_EXTERNAL_URL
          value: "https://affine.home"
        - name: REDIS_SERVER_HOST
          value: "affine-redis"
        - name: REDIS_SERVER_PORT
          value: "6379"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: affine-db-app
              key: uri
        volumeMounts:
        - mountPath: /root/.affine/storage
          name: affine-storage
        - mountPath: /root/.affine/config
          name: affine-config

      # ---------------------------------------------------------
      # Main Application Container
      # ---------------------------------------------------------
      containers:
      - name: affine
        image: ghcr.io/toeverything/affine:stable
        env:
        - name: NODE_ENV
          value: "production"
        - name: AFFINE_SERVER_HOST
          value: "0.0.0.0"
        - name: AFFINE_SERVER_PORT
          value: "3010"
        - name: AFFINE_SERVER_EXTERNAL_URL
          value: "https://affine.home"
        - name: REDIS_SERVER_HOST
          value: "affine-redis"
        - name: REDIS_SERVER_PORT
          value: "6379"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: affine-db-app
              key: uri
        ports:
        - containerPort: 3010
        volumeMounts:
        - mountPath: /root/.affine/storage
          name: affine-storage
        - mountPath: /root/.affine/config
          name: affine-config
      volumes:
      - name: affine-storage
        persistentVolumeClaim:
          claimName: affine-storage-pvc
      - name: affine-config
        persistentVolumeClaim:
          claimName: affine-config-pvc