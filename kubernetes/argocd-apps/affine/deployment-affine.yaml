apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  namespace: affine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: affine
  template:
    metadata:
      labels:
        app: affine
    spec:
      containers:
      - name: affine
        image: ghcr.io/toeverything/affine-graphql:stable
        env:
        - name: NODE_ENV
          value: "production"
        - name: AFFINE_SERVER_HOST
          value: "0.0.0.0"
        - name: AFFINE_SERVER_PORT
          value: "3010"
        # The external URL must match your Gateway Hostname
        - name: AFFINE_SERVER_EXTERNAL_URL
          value: "https://affine.home" 
        
        # Redis Configuration
        - name: REDIS_SERVER_HOST
          value: "affine-redis"
        - name: REDIS_SERVER_PORT
          value: "6379"

        # Database Configuration via CNPG Secret
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: affine-db-app  # Auto-generated by CNPG
              key: uri             # Contains the full connection string
              
        ports:
        - containerPort: 3010
        volumeMounts:
        - mountPath: /root/.affine/storage
          name: affine-storage
        - mountPath: /root/.affine/config
          name: affine-config
      volumes:
      - name: affine-storage
        persistentVolumeClaim:
          claimName: affine-storage-pvc
      - name: affine-config
        persistentVolumeClaim:
          claimName: affine-config-pvc