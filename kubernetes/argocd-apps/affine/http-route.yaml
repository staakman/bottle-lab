apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: affine-route
  namespace: affine
spec:
  hostnames:
  - affine.home  # Change this to your desired domain
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: public-gateway
    namespace: kube-system
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: affine
      port: 3010
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /