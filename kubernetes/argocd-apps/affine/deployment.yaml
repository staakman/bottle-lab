apiVersion: v1
kind: Service
metadata:
  name: affine
  namespace: affine
spec:
  ports:
    - port: 3010
      targetPort: 3010
  selector:
    app: affine
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  namespace: affine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: affine
  template:
    metadata:
      labels:
        app: affine
    spec:
      # InitContainer handles the 'affine_migration' service logic
      initContainers:
        - name: migration
          image: ghcr.io/toeverything/affine:stable
          command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
          env:
            - name: REDIS_SERVER_HOST
              value: affine-redis
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: affine-db-app
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: affine-db-app
                  key: password
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: affine-db-app
                  key: host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: affine-db-app
                  key: dbname
            # Construct the connection string manually as Affine expects
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASS)@$(DB_HOST):5432/$(DB_NAME)"
          volumeMounts:
            - mountPath: /root/.affine/storage
              name: storage
            - mountPath: /root/.affine/config
              name: config
      containers:
        - name: affine
          image: ghcr.io/toeverything/affine:stable
          ports:
            - containerPort: 3010
          env:
            - name: REDIS_SERVER_HOST
              value: affine-redis
            - name: AFFINE_INDEXER_ENABLED
              value: "false"
            # Map CNPG secrets to Environment variables
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: affine-db-app
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: affine-db-app
                  key: password
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: affine-db-app
                  key: host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: affine-db-app
                  key: dbname
            # Construct the connection string manually as Affine expects
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASS)@$(DB_HOST):5432/$(DB_NAME)"
          volumeMounts:
            - mountPath: /root/.affine/storage
              name: storage
            - mountPath: /root/.affine/config
              name: config
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: affine-storage
        - name: config
          persistentVolumeClaim:
            claimName: affine-config