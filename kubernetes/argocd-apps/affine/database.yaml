---
# 2. Define the Cluster
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: affine-db
  namespace: affine
spec:
  instances: 3

  # Reference the image and the catalog
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: affine-catalog
  
  # User 999 is required for pgvector image
  postgresUID: 999
  postgresGID: 999
  
  storage:
    size: 5Gi
    storageClass: longhorn

  # Backups (Preserved from your previous config)
  backup:
    barmanObjectStore:
      destinationPath: s3://affine-backup/
      endpointURL: https://hel1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: s3-backup-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: s3-backup-creds
          key: ACCESS_SECRET_KEY
    retentionPolicy: "3m"

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      # REMOVED: shared_preload_libraries (Managed by CNPG operator)

  bootstrap:
    initdb:
      database: affine
      owner: affine
      postInitSQL:
      - "CREATE EXTENSION IF NOT EXISTS vector;"