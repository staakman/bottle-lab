apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: affine-db
  namespace: affine
spec:
  instances: 3

  imageName: pgvector/pgvector:pg16
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: pgvector-catalog
  
  # set user and group id
  postgresUID: 999
  postgresGID: 999
  
  storage:
    size: 5Gi
    storageClass: longhorn

  backup:
    barmanObjectStore:
      destinationPath: s3://affine-backup/
      endpointURL: https://hel1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: s3-backup-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: s3-backup-creds
          key: ACCESS_SECRET_KEY
    retentionPolicy: "3m"

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      shared_preload_libraries: "vector"

  bootstrap:
    initdb:
      database: affine
      owner: affine
      postInitSQL:
      - "CREATE EXTENSION IF NOT EXISTS vector;"