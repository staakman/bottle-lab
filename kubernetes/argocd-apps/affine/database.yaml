apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: affine-db
  namespace: affine
spec:
  instances: 2
  # CNPG typically creates a secret named <cluster-name>-app containing credentials
  storage:
    size: 5Gi
    storageClass: longhorn
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
  bootstrap:
    initdb:
      database: affine
      owner: affine
---
# This resource explicitly enables the pgvector extension
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: affine-db-config
  namespace: affine
spec:
  name: affine
  owner: affine
  cluster:
    name: affine-db
  extensions:
    - name: vector