apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hedgedoc-db
  namespace: hedgedoc
spec:
  instances: 2
  
  storage:
    size: 5Gi
    storageClass: longhorn

  backup:
    barmanObjectStore:
      destinationPath: s3://hedgedoc-backup/
      endpointURL: https://hel1.your-objectstorage.com
      s3Credentials:                                          # secret.yaml is saved in Proton Pass!
        accessKeyId:
          name: s3-backup-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: s3-backup-creds
          key: ACCESS_SECRET_KEY
    retentionPolicy: "3m"                                    # Retention policy: Keep backups for 12 months

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"

  bootstrap:
    initdb:
      # source: old-cluster-backup        # uncomment when restoring from backup!
      database: hedgedoc-db               # comment when restoring from backup!
      owner: hedgedoc
      secret:
        name: hedgedoc-db-creds

  # externalClusters:
  #   - name: old-cluster-backup
  #     barmanObjectStore:
  #       serverName: hedgedoc-db
  #       destinationPath: s3://hedgedoc-backup/
  #       endpointURL: https://hel1.your-objectstorage.com
  #       s3Credentials:
  #         accessKeyId:
  #           name: s3-backup-creds
  #           key: ACCESS_KEY_ID
  #         secretAccessKey:
  #           name: s3-backup-creds
  #           key: ACCESS_SECRET_KEY

---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: hedgedoc-daily-backup
  namespace: hedgedoc
spec:
  schedule: "0 0 2 * * *"                             # Every day at 2:00 AM
  cluster:
    name: hedgedoc-db