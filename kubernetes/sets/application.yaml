apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applications
  namespace: argo
spec:
  project: default
  source:
    repoURL: https://github.com/staakman/bottle-lab
    path: kubernetes/argocd-apps
    targetRevision: HEAD
  destination:
    namespace: argo
    name: in-cluster
  syncPolicy:
    automated:
      selfHeal: true
      prune: true