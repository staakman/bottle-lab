apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      namespace: jellyfin
      labels:
        app: sonarr
    spec:
      securityContext:
        fsGroup: 1000
      nodeSelector:
        topology.kubernetes.io/zone: Dagobah
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.16
          envFrom:
            - configMapRef:
                name: common-env
                optional: true
          ports:
            - name: http
              containerPort: 8989
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data/media/tvshows
              subPath: tvshows
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: data
          persistentVolumeClaim:
            claimName: jellyfin-media
        