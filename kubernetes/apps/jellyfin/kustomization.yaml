apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: true
    pairs:
      app: jellyfin

configMapGenerator:
  - name: jellyfin-env
    namespace: jellyfin
    literals:
      - TZ="Europe/Amsterdam"

resources:
  - namespace.yaml
  - service.yaml
  - storage.yaml
  - http-route.yaml
  - deployment.yaml
