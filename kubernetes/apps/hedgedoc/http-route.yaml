apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hedgedoc-route
  namespace: hedgedoc
spec:
  hostnames:
    - "hedgedoc.home"
  parentRefs:
    - name: public-gateway
      namespace: kube-system
      kind: Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hedgedoc
          port: 3000